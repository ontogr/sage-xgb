<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="windows-title windows-desc">
<title id="windows-title">Trailing window rule</title>
<desc id="windows-desc">For a send at time t, the window covers t minus w up to but not including t. A send exactly w earlier counts, and sends in the same minute never count each other.</desc>
<style>
.panel{fill:#faf8f3;stroke:#e4e0d6}
.title{font:600 16px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.stage{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.08em;fill:#6b655f}
.box{fill:#f3f0e9;stroke:#cbc6b9}
.box-title{font:600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.box-sub{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f}
.chip{fill:#ffffff;stroke:#cbc6b9}
.chip-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.chip-tag{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1d4ed8}
.node{fill:#eaf0fe;stroke:#1d4ed8;stroke-width:1.25}
.node-name{font:600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.node-sub{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f}
.focal{fill:#1d4ed8;stroke:#1d4ed8;stroke-width:1.25}
.focal-name{font:600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}
.focal-sub{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#ffffff;opacity:.9}
.band{fill:none;stroke:#cbc6b9;stroke-dasharray:3 4}
.edge{fill:none;stroke:#6b655f;stroke-width:1.5}
.edge-blue{fill:none;stroke:#1d4ed8;stroke-width:1.5}
.edge-dash{fill:none;stroke:#1d4ed8;stroke-width:1.5;stroke-dasharray:5 4}
.edge-soft{fill:none;stroke:#6b655f;stroke-width:1.25;stroke-dasharray:5 4}
.tick{stroke:#6b655f;stroke-width:1.25}
.elabel{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f;letter-spacing:.04em}
.elabel-blue{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1d4ed8;letter-spacing:.04em}
.note{font:12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#6b655f}
.note-ink{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.arrowhead{fill:#6b655f}
.arrowhead-blue{fill:#1d4ed8}
.dot{fill:#ffffff;stroke:#6b655f;stroke-width:1.5}
.dot-focal{fill:#1d4ed8;stroke:#1d4ed8;stroke-width:1.5}
.dot-open{fill:#faf8f3;stroke:#1d4ed8;stroke-width:1.75}
.dot-num{font:600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1f2937}
.dot-num-focal{font:600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#ffffff}
</style>
<defs><marker id="ah-windows" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker><marker id="ah-blue-windows" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead-blue" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="panel" x="0.5" y="0.5" width="879" height="469" rx="10"/>
<text class="title" x="28" y="36">Trailing window [t - w, t)</text>
<text class="note" x="28" y="58">One sender, four sends. The count is of the sender's earlier sends in the last hour.</text>
<circle class="dot-open" cx="548" cy="50" r="9"/>
<text class="note" x="564" y="54">row at t: excluded</text>
<circle class="dot-focal" cx="704" cy="50" r="9"/>
<text class="note" x="720" y="54">row at t - w: counted</text>
<line class="edge" x1="80" y1="230" x2="790" y2="230"/>
<line class="tick" x1="100" y1="224" x2="100" y2="236"/>
<text class="elabel" x="100" y="256" text-anchor="middle">09:00</text>
<line class="tick" x1="250" y1="224" x2="250" y2="236"/>
<text class="elabel" x="250" y="256" text-anchor="middle">09:30</text>
<line class="tick" x1="400" y1="224" x2="400" y2="236"/>
<text class="elabel" x="400" y="256" text-anchor="middle">10:00</text>
<line class="tick" x1="550" y1="224" x2="550" y2="236"/>
<text class="elabel" x="550" y="256" text-anchor="middle">10:30</text>
<line class="tick" x1="700" y1="224" x2="700" y2="236"/>
<text class="elabel" x="700" y="256" text-anchor="middle">11:00</text>
<path class="edge-blue" d="M400 130L700 130"/>
<path class="edge-dash" d="M400 130L400 186"/>
<path class="edge-dash" d="M700 130L700 186"/>
<circle class="dot-focal" cx="400" cy="130" r="9"/>
<circle class="dot-open" cx="700" cy="130" r="9"/>
<text class="elabel-blue" x="550" y="116" text-anchor="middle">WINDOW OF SEND 4: [10:00, 11:00)</text>
<text class="elabel-blue" x="550" y="154" text-anchor="middle">contains sends 1, 2, 3: count 3</text>
<circle class="dot" cx="400" cy="202" r="9"/>
<text class="dot-num" x="400" y="205.5" text-anchor="middle">1</text>
<circle class="dot" cx="550" cy="202" r="9"/>
<text class="dot-num" x="550" y="205.5" text-anchor="middle">2</text>
<circle class="dot" cx="550" cy="178" r="9"/>
<text class="dot-num" x="550" y="181.5" text-anchor="middle">3</text>
<circle class="dot-focal" cx="700" cy="202" r="9"/>
<text class="dot-num-focal" x="700" y="205.5" text-anchor="middle">4</text>
<text class="box-sub" x="534" y="180" text-anchor="end">same minute</text>
<path class="edge-soft" d="M250 300L550 300"/>
<path class="edge-soft" d="M250 300L250 270"/>
<path class="edge-soft" d="M550 300L550 270"/>
<text class="elabel" x="400" y="322" text-anchor="middle">WINDOW OF SENDS 2 AND 3: [09:30, 10:30)</text>
<text class="elabel" x="400" y="338" text-anchor="middle">contains send 1 only: count 1 each</text>
<rect class="chip" x="28" y="376" width="196" height="34" rx="5"/>
<text class="chip-name" x="40" y="397">Send 1, 10:00</text>
<text class="chip-tag" x="212" y="397" text-anchor="end">count 0</text>
<rect class="chip" x="236" y="376" width="196" height="34" rx="5"/>
<text class="chip-name" x="248" y="397">Send 2, 10:30</text>
<text class="chip-tag" x="420" y="397" text-anchor="end">count 1</text>
<rect class="chip" x="444" y="376" width="196" height="34" rx="5"/>
<text class="chip-name" x="456" y="397">Send 3, 10:30</text>
<text class="chip-tag" x="628" y="397" text-anchor="end">count 1</text>
<rect class="node" x="652" y="376" width="196" height="34" rx="5"/>
<text class="node-name" x="664" y="397">Send 4, 11:00</text>
<text class="chip-tag" x="836" y="397" text-anchor="end">count 3</text>
<text class="note" x="28" y="436">Send 4 counts send 1 because send 1 is exactly 60 minutes earlier. Sends 2 and 3 share a minute,</text>
<text class="note" x="28" y="454">so neither counts the other. The same rule holds for the 24 hour and 7 day windows.</text>
</svg>
