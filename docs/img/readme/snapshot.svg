<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="snapshot-title snapshot-desc">
<title id="snapshot-title">Snapshot and scoring</title>
<desc id="snapshot-desc">Snapshot d holds earlier days only. Accounts active on day d are sampled from it and encoded, and the edge head scores each Transaction of day d.</desc>
<style>
.panel{fill:#faf8f3;stroke:#e4e0d6}
.title{font:600 16px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.stage{font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.08em;fill:#6b655f}
.box{fill:#f3f0e9;stroke:#cbc6b9}
.box-title{font:600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.box-sub{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f}
.chip{fill:#ffffff;stroke:#cbc6b9}
.chip-name{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.chip-tag{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1d4ed8}
.node{fill:#eaf0fe;stroke:#1d4ed8;stroke-width:1.25}
.node-name{font:600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.node-sub{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f}
.focal{fill:#1d4ed8;stroke:#1d4ed8;stroke-width:1.25}
.focal-name{font:600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}
.focal-sub{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#ffffff;opacity:.9}
.band{fill:none;stroke:#cbc6b9;stroke-dasharray:3 4}
.edge{fill:none;stroke:#6b655f;stroke-width:1.5}
.edge-blue{fill:none;stroke:#1d4ed8;stroke-width:1.5}
.edge-dash{fill:none;stroke:#1d4ed8;stroke-width:1.5;stroke-dasharray:5 4}
.edge-soft{fill:none;stroke:#6b655f;stroke-width:1.25;stroke-dasharray:5 4}
.tick{stroke:#6b655f;stroke-width:1.25}
.elabel{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#6b655f;letter-spacing:.04em}
.elabel-blue{font:10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1d4ed8;letter-spacing:.04em}
.note{font:12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#6b655f}
.note-ink{font:600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;fill:#1f2937}
.arrowhead{fill:#6b655f}
.arrowhead-blue{fill:#1d4ed8}
.dot{fill:#ffffff;stroke:#6b655f;stroke-width:1.5}
.dot-focal{fill:#1d4ed8;stroke:#1d4ed8;stroke-width:1.5}
.dot-open{fill:#faf8f3;stroke:#1d4ed8;stroke-width:1.75}
.dot-num{font:600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1f2937}
.dot-num-focal{font:600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#ffffff}
</style>
<defs><marker id="ah-snapshot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker><marker id="ah-blue-snapshot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead-blue" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="panel" x="0.5" y="0.5" width="879" height="419" rx="10"/>
<text class="title" x="28" y="36">Snapshot(d) and scoring</text>
<text class="note" x="28" y="58">The GraphSAGE GNN scores day d from earlier days. No day-d edge reaches a message.</text>
<rect class="focal" x="28" y="90" width="184" height="104" rx="6"/>
<text class="focal-name" x="42" y="114">History window</text>
<text class="focal-sub" x="42" y="134">days before d - lag</text>
<text class="focal-sub" x="42" y="148">at most history_days</text>
<text class="focal-sub" x="42" y="162">never includes day d</text>
<rect class="box" x="246" y="90" width="184" height="104" rx="6"/>
<text class="box-title" x="260" y="114">Snapshot(d)</text>
<text class="box-sub" x="260" y="134">each Transaction twice:</text>
<text class="box-sub" x="260" y="148">forward and reverse edge</text>
<text class="box-sub" x="260" y="162">node features: counts,</text>
<text class="box-sub" x="260" y="176">USD sums and maxima</text>
<rect class="box" x="464" y="90" width="184" height="104" rx="6"/>
<text class="box-title" x="478" y="114">Sampling</text>
<text class="box-sub" x="478" y="134">NeighborLoader</text>
<text class="box-sub" x="478" y="148">seeds: Accounts active</text>
<text class="box-sub" x="478" y="162">on day d; gnn.neighbors</text>
<rect class="node" x="682" y="90" width="170" height="104" rx="6"/>
<text class="node-name" x="696" y="114">GraphSAGE encoder</text>
<text class="node-sub" x="696" y="134">layers set by</text>
<text class="node-sub" x="696" y="148">gnn.encoder; one</text>
<text class="node-sub" x="696" y="162">embedding per Account</text>
<path class="edge" d="M212 142L246 142" marker-end="url(#ah-snapshot)"/>
<path class="edge" d="M430 142L464 142" marker-end="url(#ah-snapshot)"/>
<path class="edge" d="M648 142L682 142" marker-end="url(#ah-snapshot)"/>
<rect class="chip" x="464" y="276" width="184" height="40" rx="5"/>
<text class="chip-name" x="476" y="300">Transactions of day d</text>
<rect class="node" x="682" y="252" width="170" height="104" rx="6"/>
<text class="node-name" x="696" y="276">Edge head</text>
<text class="node-sub" x="696" y="296">sender, receiver and</text>
<text class="node-sub" x="696" y="310">Transaction attributes</text>
<text class="node-sub" x="696" y="324">gnn_score, gnn_emb_*</text>
<path class="edge" d="M556 276L556 194" marker-end="url(#ah-snapshot)"/>
<text class="elabel" x="566" y="240">ACTIVE ACCOUNTS</text>
<path class="edge" d="M648 296L682 296" marker-end="url(#ah-snapshot)"/>
<path class="edge" d="M767 194L767 252" marker-end="url(#ah-snapshot)"/>
<rect class="box" x="28" y="252" width="380" height="104" rx="6"/>
<text class="box-title" x="42" y="276">Training uses the same snapshots</text>
<text class="box-sub" x="42" y="296">LinkNeighborLoader over day-d seeds</text>
<text class="box-sub" x="42" y="310">every positive + neg_sample_rate of negatives</text>
<text class="box-sub" x="42" y="324">fixed epochs, no early stopping</text>
<text class="box-sub" x="42" y="338">days with an empty snapshot are skipped</text>
</svg>
