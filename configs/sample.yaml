extends: hi_small.yaml

variant: hi-small-sample

data:
  raw_dir: tests/fixtures/amlworld_hi_small_sample

xgb:
  n_estimators: 80
  early_stopping_rounds: 10
  num_threads: 2

gnn:
  hidden: 16
  neighbors: [5, 3]
  batch_size: 512
  score_batch_size: 2048
  neg_sample_rate: 0.2
  epochs: 2
  num_threads: 1

tune:
  n_trials: 3
  timeout_minutes: 2
