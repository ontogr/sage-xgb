fail_fast: true

# The committed AMLworld sample must stay byte-identical to the rows the builder
# wrote. Whitespace and line-ending fixers would rewrite them, and typos would
# flag their ids and hashes.
exclude: ^tests/fixtures/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast # checks Python syntax
      - id: check-json # checks JSON syntax
      - id: check-merge-conflict # checks for no merge conflict strings
      - id: check-shebang-scripts-are-executable # checks all shell scripts have executable permissions
      - id: check-toml # checks TOML syntax
      - id: check-yaml # checks YAML syntax
      - id: end-of-file-fixer # checks there is a newline at the end of the file
      - id: mixed-line-ending # normalizes line endings
      - id: trailing-whitespace # trims trailing whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --unsafe-fixes, --exit-non-zero-on-fix]
        types_or: [python, jupyter]
      - id: ruff-format
        types_or: [python, jupyter]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock

  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        args:
          [
            "-c",
            "pyproject.toml",
            "-r",
            "--severity-level",
            "high",
            "--confidence-level",
            "high",
            "sage_xgb/",
          ]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: [--force-exclude]
        require_serial: true

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --locked ty check sage_xgb scripts tests
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --locked pytest tests/unit
        language: system
        types: [python]
        pass_filenames: false

ci:
  autofix_prs: true
  autofix_commit_msg: "Auto fixes from pre-commit"
  autofix_prs_limit: 5
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "Pre-commit autoupdate"
  skip: [ty, pytest]
